name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Prefer Environment secrets (Settings → Environments → cloudflare-pages):
    #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
    # Repository secrets with the same names also work if the job can read them.
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        run: |
          pnpm docs:check
          pnpm docs:build
          python3 scripts/verify_rendered_links.py

      - name: Verify build output
        run: |
          test -f .vitepress/dist/index.html
          # VitePress may put public/ assets at dist root
          ls -la .vitepress/dist | head -n 40
          echo "VitePress dist OK"

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            echo "Add Environment secrets on 'cloudflare-pages' (or repository secrets)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=5" || true)
          echo "Pages projects API HTTP ${code}"
          head -c 600 /tmp/cf-pages.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare Pages API rejected the token (HTTP ${code})."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECT=pcln-docs
          # Use pnpm dlx — npx fails on this package's devEngines (pnpm-only).
          pnpm dlx wrangler@4 whoami || true
          if ! pnpm dlx wrangler@4 pages project list 2>/dev/null | grep -F "$PROJECT" >/dev/null; then
            echo "Creating Pages project: $PROJECT"
            pnpm dlx wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
          pnpm dlx wrangler@4 pages deploy .vitepress/dist \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true

          # Bind docs.pcln.top (idempotent). DNS must point at Cloudflare.
          for domain in docs.pcln.top; do
            echo "Ensuring custom domain: $domain"
            code=$(curl -sS -o /tmp/cf-domain.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
              --data "{\"name\":\"${domain}\"}" || true)
            echo "domain ${domain} HTTP ${code}"
            head -c 500 /tmp/cf-domain.json || true
            echo
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then
              if grep -qiE 'already|exists|taken' /tmp/cf-domain.json 2>/dev/null; then
                echo "Domain ${domain} already attached."
              else
                echo "::warning::Could not attach ${domain} (HTTP ${code}). Add it in Pages → Custom domains."
              fi
            fi
          done

          echo "deployment-url=https://docs.pcln.top" >> "$GITHUB_OUTPUT"
          echo "preview-url=https://${PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"
